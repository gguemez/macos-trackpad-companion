[package]
name = "macos-trackpad-companion"
version = "0.9.3"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
default-run = "companion"

[[bin]]
name = "companion"
path = "src/main.rs"

[[bin]]
name = "gesture-tap"
path = "src/bin/gesture_tap.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[[test]]
name = "appkit"
path = "tests/appkit.rs"
harness = false

[dependencies]
core-foundation     = "0.10"
core-foundation-sys = "0.8"
core-graphics       = "0.25"
io-kit-sys          = "0.5"
libc                = "0.2"
log                 = "0.4"
env_logger          = "0.11"
anyhow              = "1"
clap                = { version = "4", features = ["derive"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
toml                = "0.8"
objc2 = "0.6.4"
block2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
toml_edit = "0.25.15"

[profile.release]
lto = "fat"
opt-level = 3
debug = 1
